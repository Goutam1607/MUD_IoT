<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>MUD Gateway Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one idea per page, like slides. Big animated stage + side card, caption bar underneath, page dots on top. Lexend chosen for readability by non-experts. */
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#18222B; --muted:#5D6A72; --line:#D3DCD9;
  --brand:#0F766E; --brand-soft:#D7EFEB; --amber:#C77700; --amber-soft:#FCEDD3;
  --ok:#23894A; --ok-soft:#DCF2E3; --bad:#D23A3A; --bad-soft:#FBE0DF; --wire:#B9C5C2;
  --sans:"Lexend", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101716; --card:#18211F; --ink:#E6EEEC; --muted:#93A4A0; --line:#2B3A37;
  --brand:#3CC4B6; --brand-soft:#123A36; --amber:#F2A93B; --amber-soft:#3B2C12;
  --ok:#4CC57A; --ok-soft:#14351F; --bad:#FF6B6B; --bad-soft:#3E1A1A; --wire:#3A4B47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101716; --card:#18211F; --ink:#E6EEEC; --muted:#93A4A0; --line:#2B3A37;
  --brand:#3CC4B6; --brand-soft:#123A36; --amber:#F2A93B; --amber-soft:#3B2C12;
  --ok:#4CC57A; --ok-soft:#14351F; --bad:#FF6B6B; --bad-soft:#3E1A1A; --wire:#3A4B47; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 18px;display:grid;gap:12px;min-height:100%;grid-template-rows:auto auto 1fr auto}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--brand);display:inline-block}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center}
.dot{width:30px;height:8px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0}
.dot.done{background:var(--brand-soft)}
.dot.on{background:var(--brand)}
.dot:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.pageno{font-family:var(--mono);font-size:13px;color:var(--muted)}
.iconbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}

/* headline */
.head{display:grid;gap:4px}
.kicker{font-size:13px;font-weight:600;color:var(--brand);letter-spacing:.6px;text-transform:uppercase}
h1{margin:0;font-size:clamp(24px,3.4vw,38px);font-weight:700;line-height:1.15;text-wrap:balance}
.lead{margin:0;font-size:clamp(15px,1.6vw,18px);color:var(--muted);max-width:75ch}

/* body */
.body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.body.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.body{grid-template-columns:minmax(0,1fr)}}
.stagewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;display:grid}
.stagebox{overflow-x:auto}
svg#stage{display:block;width:100%;min-width:560px;height:auto}
.caption{border-top:1px solid var(--line);padding:14px 18px;min-height:76px;display:flex;gap:12px;align-items:center}
.caption .cicon{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700}
.caption .cicon.ok{background:var(--ok-soft);color:var(--ok)} .caption .cicon.bad{background:var(--bad-soft);color:var(--bad)}
.caption p{margin:0;font-size:clamp(15px,1.7vw,19px);line-height:1.45}
.caption b{font-weight:600}
.stagebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.btn{font:inherit;font-weight:600;font-size:14.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:var(--card);color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"].before{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].after{background:var(--ok);color:#fff}
.grow{flex:1}
label.spd{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
select,input{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

/* side card */
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.side h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.side .note{font-size:13px;color:var(--muted);margin:0}
.rb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rb li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px;line-height:1.35;transition:background .25s,border-color .25s}
.rb li .n{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.rb li small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rb li.deny{border-style:dashed}
.rb li.hl-ok{background:var(--ok-soft);border-color:var(--ok)}
.rb li.hl-bad{background:var(--bad-soft);border-color:var(--bad)}
.rb li.dim{opacity:.35}
.seal{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--bg);color:var(--muted)}
.seal.ok{background:var(--ok-soft);color:var(--ok)} .seal.bad{background:var(--bad-soft);color:var(--bad)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tally div{border-radius:8px;padding:8px 10px;background:var(--bg);display:grid}
.tally b{font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.tally .g b{color:var(--ok)} .tally .r b{color:var(--bad)}
.tally span{font-size:12px;color:var(--muted)}
.legend{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:14px}
.legend li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:start}
.legend svg{width:30px;height:30px}
.keyfacts{display:grid;gap:8px}
.keyfacts div{border-left:3px solid var(--brand);padding:2px 0 2px 10px;font-size:14px}

details.tech{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.tech summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
details.tech div{font-size:13.5px;margin-top:8px;display:grid;gap:6px}
details.tech code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px;word-break:break-word}

/* bottom nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav .hint{font-size:13px;color:var(--muted)}

/* results & summary pages */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:18px}
.big div{border-radius:12px;background:var(--bg);padding:14px 16px;display:grid;gap:4px}
.big b{font-size:clamp(28px,3.4vw,40px);font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.05}
.big span{font-size:15px}
.big small{font-size:12.5px;color:var(--muted)}
.lab{display:grid;gap:10px}
.lab label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.lab select,.lab input{width:100%}
.verdict{border-radius:8px;padding:10px 12px;background:var(--bg);font-size:14.5px;min-height:46px}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--bad-soft)}

/* svg */
.lbl{fill:var(--ink);font-family:var(--sans);font-size:15px;font-weight:600}
.sub{fill:var(--muted);font-family:var(--sans);font-size:12.5px}
.wire{stroke:var(--wire);stroke-width:3;fill:none;stroke-linecap:round}
.wire.dash{stroke-dasharray:6 7}
.pk text{font-family:var(--sans);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--card);stroke-width:4px;fill:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <div class="top">
    <div class="brand"><i></i>MUD Gateway · how it protects smart devices</div>
    <nav class="dots" id="dots" aria-label="Pages"></nav>
    <span class="pageno" id="pageno"></span>
    <button class="iconbtn" id="fsBtn" type="button">Full screen</button>
  </div>

  <header class="head">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <main class="body" id="body">
    <section class="stagewrap" id="stagewrap">
      <div class="stagebox" id="stagebox">
        <svg id="stage" viewBox="0 0 960 430" role="img" aria-label="Animated diagram"></svg>
      </div>
      <div id="bigbox" hidden></div>
      <div class="caption" aria-live="polite"><div class="cicon" id="cicon">i</div><p id="cap"></p></div>
      <div class="stagebar" id="stagebar">
        <button class="btn primary" id="playBtn" type="button">▶ Play</button>
        <div class="seg" id="seg" hidden>
          <button type="button" class="before" id="segBefore" aria-pressed="false">Without our fix</button>
          <button type="button" class="after" id="segAfter" aria-pressed="true">With our fix</button>
        </div>
        <span class="grow"></span>
        <label class="spd" for="speed">Speed
          <select id="speed"><option value="0.6">Slow</option><option value="1" selected>Normal</option><option value="1.6">Fast</option></select>
        </label>
      </div>
    </section>
    <aside class="side" id="side"></aside>
  </main>

  <div class="nav">
    <button class="btn" id="prevBtn" type="button">← Back</button>
    <details class="tech" id="tech"><summary>For the examiner: technical details</summary><div id="techBody"></div></details>
    <button class="btn primary" id="nextBtn" type="button">Next →</button>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ================= icons (drawn around 0,0, about 60px) ================= */
const ICON = {
  camera: c => `<rect x="-26" y="-18" width="44" height="34" rx="8" fill="var(--card)" stroke="${c}" stroke-width="3"/><circle cx="-4" cy="-1" r="10" fill="none" stroke="${c}" stroke-width="3"/><circle cx="-4" cy="-1" r="4" fill="${c}"/><path d="M18,-8 l12,-7 v28 l-12,-7z" fill="${c}"/>`,
  sensor: c => `<rect x="-8" y="-28" width="16" height="40" rx="8" fill="var(--card)" stroke="${c}" stroke-width="3"/><circle cx="0" cy="18" r="11" fill="${c}"/><rect x="-3" y="-8" width="6" height="26" fill="${c}"/>`,
  laptop: c => `<rect x="-26" y="-20" width="52" height="32" rx="4" fill="var(--card)" stroke="${c}" stroke-width="3"/><path d="M-34,18 h68" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`,
  lock: c => `<rect x="-17" y="-4" width="34" height="28" rx="5" fill="${c}"/><path class="shackle" d="M-10,-4 v-10 a10,10 0 0 1 20,0 v10" fill="none" stroke="${c}" stroke-width="5"/><circle cx="0" cy="9" r="4" fill="var(--card)"/>`,
  guard: c => `<path d="M0,-38 L32,-26 V2 C32,22 16,34 0,40 C-16,34 -32,22 -32,2 V-26 Z" fill="var(--brand-soft)" stroke="${c}" stroke-width="3.5"/><path d="M-12,2 l9,9 l17,-19" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`,
  router: c => `<rect x="-32" y="-10" width="64" height="26" rx="6" fill="var(--card)" stroke="${c}" stroke-width="3"/><path d="M-18,-10 l-6,-18 M18,-10 l6,-18" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="-14" cy="3" r="3" fill="${c}"/><circle cx="-2" cy="3" r="3" fill="${c}"/>`,
  cloud: c => `<path d="M-30,14 a14,14 0 0 1 2,-28 a20,20 0 0 1 36,-6 a15,15 0 0 1 20,20 a12,12 0 0 1 -4,14 z" fill="var(--card)" stroke="${c}" stroke-width="3"/>`,
  phone: c => `<rect x="-16" y="-28" width="32" height="56" rx="6" fill="var(--card)" stroke="${c}" stroke-width="3"/><circle cx="0" cy="20" r="3" fill="${c}"/>`,
  hacker: c => `<circle cx="0" cy="-10" r="16" fill="${c}"/><path d="M-28,30 a28,22 0 0 1 56,0 z" fill="${c}"/><rect x="-12" y="-15" width="24" height="7" rx="3" fill="var(--card)"/>`,
  factory: c => `<path d="M-30,26 V-4 l16,-10 v10 l16,-10 v10 l16,-10 V-24 h10 V26 z" fill="var(--card)" stroke="${c}" stroke-width="3" stroke-linejoin="round"/><rect x="-20" y="8" width="8" height="10" fill="${c}"/><rect x="-4" y="8" width="8" height="10" fill="${c}"/>`,
  book: c => `<rect x="-22" y="-28" width="44" height="56" rx="4" fill="var(--card)" stroke="${c}" stroke-width="3"/><path d="M-12,-14 h24 M-12,-4 h24 M-12,6 h16" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="20" r="9" fill="var(--amber)"/>`,
  board: c => `<rect x="-34" y="-28" width="68" height="50" rx="5" fill="var(--card)" stroke="${c}" stroke-width="3"/><rect x="-26" y="-20" width="22" height="14" fill="var(--amber-soft)" stroke="${c}" stroke-width="1.5"/><rect x="2" y="-18" width="24" height="12" fill="var(--brand-soft)" stroke="${c}" stroke-width="1.5"/><rect x="-22" y="0" width="26" height="14" fill="var(--brand-soft)" stroke="${c}" stroke-width="1.5"/><path d="M-20,22 v10 M20,22 v10" stroke="${c}" stroke-width="3"/>`,
  people: c => `<circle cx="-12" cy="-10" r="9" fill="${c}"/><circle cx="12" cy="-10" r="9" fill="${c}"/><path d="M-28,22 a16,16 0 0 1 32,0z M-4,22 a16,16 0 0 1 32,0z" fill="${c}"/>`,
  antenna: c => `<path d="M0,-6 V30" stroke="${c}" stroke-width="4"/><path d="M-12,-14 a16,16 0 0 1 24,0 M-20,-22 a28,28 0 0 1 40,0" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-6" r="5" fill="${c}"/>`,
};

/* ================= stage engine ================= */
const S = {page:0, run:0, speed:1, mode:"after", playing:false};
const ABORT = Symbol("abort");
const N = {};   // node positions on current page
function clear(){ $("stage").innerHTML = '<g id="L-bg"></g><g id="L-wire"></g>'; for (const k in N) delete N[k]; }
function zone(x, y, w, h, label){
  const g = $("L-bg");
  g.insertAdjacentHTML("beforeend", `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="var(--bg)"/><text class="sub" x="${x+w/2}" y="${y+h-14}" text-anchor="middle">${label}</text>`);
}
function el(tag, attrs, html){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html) e.innerHTML = html; $("stage").appendChild(e); return e; }
function node(id, x, y, icon, label, sub, color){
  N[id] = {x, y};
  const g = el("g", {id:"n-"+id, transform:`translate(${x},${y})`});
  g.innerHTML = `<g class="ic">${ICON[icon](color || "var(--ink)")}</g>
    <text class="lbl" x="0" y="62" text-anchor="middle">${label}</text>
    ${sub ? `<text class="sub" x="0" y="80" text-anchor="middle">${sub}</text>` : ""}
    <g class="tag"></g>`;
  return g;
}
function recolor(id, color){ const g = $("n-"+id); if (g) g.querySelector(".ic").innerHTML = ICON[g.dataset.icon || guessIcon(id)](color); }
function guessIcon(id){ return ({cam:"camera", camx:"camera", sensor:"sensor", laptop:"laptop", lock:"lock", guard:"guard", router:"router", cloud:"cloud", phone:"phone", hacker:"hacker", factory:"factory", book:"book", board:"board", people:"people", ant:"antenna", hot:"phone"})[id] || "cloud"; }
function tag(id, text, kind){
  const g = $("n-"+id); if (!g) return;
  const t = g.querySelector(".tag");
  if (!text){ t.innerHTML = ""; return; }
  const col = kind==="bad" ? cv("--bad") : kind==="ok" ? cv("--ok") : cv("--brand");
  const soft = kind==="bad" ? cv("--bad-soft") : kind==="ok" ? cv("--ok-soft") : cv("--brand-soft");
  const w = text.length * 7.6 + 22;
  t.innerHTML = `<rect x="${-w/2}" y="-66" width="${w}" height="24" rx="12" fill="${soft}" stroke="${col}" stroke-width="1.5"/><text x="0" y="-49" text-anchor="middle" style="font:600 13px var(--sans);fill:${col}">${text}</text>`;
}
function wire(a, b, dashed, via){
  const pts = [N[a], ...(via||[]), N[b]];
  const d = "M" + pts.map(p=>`${p.x},${p.y}`).join(" L");
  const w = document.createElementNS(NS, "path"); w.setAttribute("class", "wire" + (dashed?" dash":"")); w.setAttribute("d", d);
  $("L-wire").appendChild(w);
  return w;
}
function sleep(ms){
  const id = S.run;
  return new Promise((res, rej) => {
    let left = ms / S.speed, last = performance.now();
    (function tick(now){ if (id !== S.run) return rej(ABORT); left -= now - last; last = now; left <= 0 ? res() : requestAnimationFrame(tick); })(last);
  });
}
function pathPts(list){ return list.map(p => typeof p === "string" ? [N[p].x, N[p].y] : p); }
function packet(list, label, color, opts={}){
  const pts = pathPts(list), id = S.run;
  const g = el("g", {class:"pk"});
  const shape = opts.letter
    ? `<rect x="-14" y="-10" width="28" height="20" rx="3" fill="${color}"/><path d="M-14,-10 l14,10 l14,-10" fill="none" stroke="var(--card)" stroke-width="2"/>`
    : `<circle r="11" fill="${color}" stroke="var(--card)" stroke-width="3"/>`;
  g.innerHTML = shape + (label ? `<text x="16" y="-14">${label}</text>` : "");
  let L = 0; const seg = [];
  for (let i=1;i<pts.length;i++){ const d = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); seg.push(d); L += d; }
  const dur = (opts.dur || Math.max(700, L * 2.6));
  return new Promise((res, rej) => {
    let t = 0, last = performance.now();
    (function tick(now){
      if (id !== S.run){ g.remove(); return rej(ABORT); }
      t += (now-last) * S.speed; last = now;
      let d = Math.min(1, t/dur) * L, i = 0;
      while (i < seg.length-1 && d > seg[i]){ d -= seg[i]; i++; }
      const r = seg[i] ? d/seg[i] : 0;
      const x = pts[i][0] + (pts[i+1][0]-pts[i][0])*r, y = pts[i][1] + (pts[i+1][1]-pts[i][1])*r;
      g.setAttribute("transform", `translate(${x},${y})`);
      if (t >= dur){ if (!opts.keep) g.remove(); res(g); } else requestAnimationFrame(tick);
    })(last);
  });
}
function mark(x, y, ok, text){
  const c = ok ? cv("--ok") : cv("--bad"), soft = ok ? cv("--ok-soft") : cv("--bad-soft");
  const g = el("g", {transform:`translate(${x},${y})`});
  g.innerHTML = `<circle r="20" fill="${soft}" stroke="${c}" stroke-width="3.5"/>` +
    (ok ? `<path d="M-9,0 l6,7 l12,-14" stroke="${c}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
        : `<path d="M-8,-8 l16,16 M8,-8 l-16,16" stroke="${c}" stroke-width="4.5" stroke-linecap="round"/>`) +
    (text ? `<text y="40" text-anchor="middle" style="font:700 14px var(--sans);fill:${c};paint-order:stroke;stroke:var(--card);stroke-width:4px">${text}</text>` : "");
  const id = S.run;
  setTimeout(() => { if (id === S.run) g.remove(); }, 1700 / S.speed);
  return g;
}
function say(html, kind){
  $("cap").innerHTML = html;
  const ic = $("cicon"); ic.className = "cicon" + (kind ? " " + kind : "");
  ic.textContent = kind==="ok" ? "✓" : kind==="bad" ? "✕" : "i";
}

/* ================= side card helpers ================= */
const RULES = [
  {t:"Look up web addresses at Google DNS", s:"UDP 53 → 8.8.8.8", proto:"udp", port:53, dst:["8.8.8.8"]},
  {t:"Stay connected to the CP Plus cloud", s:"TCP 8886 → m6-cube.cppluscloud.com", proto:"tcp", port:8886, dst:["13.203.132.148","13.203.147.54"]},
  {t:"Short calls to the CP Plus app server", s:"TCP 443 → a6-cube.cppluscloud.com", proto:"tcp", port:443, dst:["3.111.59.214"]},
  {t:"Find its own public address (for live video)", s:"UDP 3478 → any (STUN)", proto:"udp", port:3478},
  {t:"Send live video through the relay server", s:"TCP 1443 → any (relay)", proto:"tcp", port:1443},
];
function rulebook(opts={}){
  const n = opts.count ?? RULES.length;
  const items = RULES.slice(0, n).map((r,i)=>`<li id="rb${i}"><span class="n">${i+1}</span><span>${r.t}<small>${r.s}</small></span></li>`).join("");
  const deny = (opts.count===undefined || opts.count>=RULES.length) ? `<li class="deny" id="rbx"><span class="n">✕</span><span><b>Anything else: not allowed.</b> Block it and write it in the log.<small>default deny · LOG + DROP</small></span></li>` : "";
  $("side").innerHTML = `<h2>📘 The camera's rulebook</h2>
    <p class="note">Written by the manufacturer. The guard reads it from top to bottom.</p>
    <div class="seal" id="seal">${opts.seal || "Official seal: not checked yet"}</div>
    <ul class="rb">${items}${deny}</ul>
    ${opts.tally ? `<div class="tally"><div class="g"><b id="tOk">0</b><span>allowed</span></div><div class="r"><b id="tBad">0</b><span>blocked</span></div></div>` : ""}`;
  if (opts.sealState) seal(opts.sealState);
}
function seal(state){
  const s = $("seal"); if (!s) return;
  s.className = "seal " + (state||"");
  s.textContent = state==="ok" ? "✓ Official seal checked: genuine" : state==="bad" ? "✕ Seal is fake: rulebook rejected" : "Official seal: not checked yet";
}
function hl(i, kind){
  document.querySelectorAll(".rb li").forEach(li => li.classList.remove("hl-ok","hl-bad"));
  if (i === null) return;
  const li = i === "x" ? $("rbx") : $("rb"+i); if (li) li.classList.add(kind==="bad" ? "hl-bad" : "hl-ok");
}
function bump(kind){ const e = $(kind==="ok"?"tOk":"tBad"); if (e) e.textContent = +e.textContent + 1; }
function match(proto, port, ip){
  for (let i=0;i<RULES.length;i++){ const r = RULES[i]; if (r.proto===proto && r.port===port && (!r.dst || r.dst.includes(ip))) return i; }
  return -1;
}
function legend(rows, title="Who's who"){
  $("side").innerHTML = `<h2>${title}</h2><ul class="legend">${rows.map(([ic,col,t])=>`<li><svg viewBox="-40 -40 80 80">${ICON[ic](col)}</svg><span>${t}</span></li>`).join("")}</ul>`;
}
function facts(title, list){
  $("side").innerHTML = `<h2>${title}</h2><div class="keyfacts">${list.map(t=>`<div>${t}</div>`).join("")}</div>`;
}

      "<b>Real result:</b> accuracy went from <b>20%</b> (6 of 30 checks right) to <b>100%</b> (30 of 30)."]);
  },
  async play(){

  tech:["Extension added to the signed MUD file: <code>\"extensions\": [\"mqtt-topic-acl\"]</code> with <code>username</code>, <code>publish</code>, <code>subscribe</code> lists.",

{ kicker:"Our addition 3", title:"Updating the rulebook safely", mode:true,
  lead:"Devices get updates, so rulebooks change. Every 2 seconds the guard checks for a new version. A new rulebook must pass the seal check, and then all the rules are swapped in one go.",
  caption:"Press <b>▶ Play</b>. Then try the switch to see what happens if rules are swapped one by one.",
  build(){ scene();
    node("cam", 140, 205, "camera", "Smart camera", "hacked, waiting", cv("--bad")); $("n-cam").dataset.icon="camera";
    node("factory", 815, 120, "factory", "Manufacturer", "", cv("--muted"));
    node("hacker", 815, 290, "hacker", "Attacker", "", cv("--bad"));
    wire("cam","guard"); wire("guard","factory"); wire("guard","hacker");
    rulebook({sealState:"ok"});
  },
  async play(){
    rulebook({sealState:"ok"});
    say("An attacker sends a <b>fake rulebook</b> that says 'allow everything'.");
    await packet(["hacker","guard"], "fake rulebook", cv("--bad"), {letter:true});
    say("The guard checks the seal…"); await sleep(800);
    seal("bad"); mark(N.guard.x, N.guard.y-60, false, "fake seal");
    say("<b>Fake seal: rejected.</b> The old, safe rules stay in place.", "ok");
    await sleep(1800); seal("ok");
    say("Now the real manufacturer publishes an <b>update</b>.");
    await packet(["factory","guard"], "new rulebook", cv("--brand"), {letter:true});
    seal("ok"); mark(N.guard.x, N.guard.y-60, true, "genuine");
    await sleep(700);
    if (S.mode === "before"){
      say("<b>Old way:</b> wipe the rules, then add them back one by one. For a moment the list is <b>empty</b>…", "bad");
      document.querySelectorAll(".rb li").forEach(li=>li.classList.add("dim"));
      const p = packet(["cam","guard","hacker"], "remote control", cv("--bad"));
      await sleep(900);
      await p; mark(N.hacker.x, N.hacker.y-60, false, "got out!");
      say("…and the hacked camera's message <b>slipped out</b> during that gap. On the Pi the gap lasted 0.2 to 0.7 seconds.", "bad");
      for (const li of document.querySelectorAll(".rb li")){ li.classList.remove("dim"); await sleep(250); }
    } else {
      say("<b>Our way:</b> all rules are replaced <b>in one go</b>, in about <b>0.17 seconds</b>. There is never a moment with no rules.", "ok");
      const g = await packet(["cam","guard"], "remote control", cv("--bad"), {keep:true});
      g.remove(); hl("x","bad"); mark(N.guard.x, N.guard.y-60, false, "blocked");
      await sleep(1200); hl(null);
      say("The hacked camera's message is <b>blocked</b>, even during the update.", "ok");
    }
  },
  tech:["<code>watchdog_monitor.py</code> polls every 2 s, compares the file's SHA-256, verifies the signature, then applies both chains in one <code>iptables-restore --noflush</code> transaction and logs to <code>logs/policy_reload_log.csv</code>.",
        "Measured over 10 updates: apply median 166 ms (fetch ~43, verify ~1.3, parse ~0.9, install ~110–140 ms); end-to-end median 1.12 s.",
        "Why atomic: an empty user chain returns to FORWARD, whose default policy is ACCEPT (fail-open). Research gap 5.4."]
},
{ kicker:"Try it yourself", title:"You are the camera. What do you try?", lab:true,
  lead:"Pick something for the camera to do. The guard checks it against the rulebook and shows which line decided.",
  caption:"Choose an action on the right and press <b>Send</b>.",
  build(){ scene();
    node("cam", 140, 205, "camera", "Smart camera", "10.42.0.17", cv("--amber")); $("n-cam").dataset.icon="camera";
    node("cloud", 815, 120, "cloud", "Camera's cloud", "", cv("--muted"));
    node("hacker", 815, 290, "hacker", "Somewhere else", "", cv("--bad"));
    wire("cam","guard"); wire("guard","cloud"); wire("guard","hacker");
    const acts = [
      ["Talk to the CP Plus cloud (TCP 8886)", "tcp", 8886, "13.203.147.54", "cloud"],
      ["Call the CP Plus app server (HTTPS 443)", "tcp", 443, "3.111.59.214", "cloud"],
      ["Look up an address at Google DNS (UDP 53)", "udp", 53, "8.8.8.8", "cloud"],

      ["Try to infect others with Telnet (23)", "tcp", 23, "203.0.113.23", "hacker"],
      ["Open a remote-control shell (4444)", "tcp", 4444, "203.0.113.66", "hacker"],
      ["Connect to the CP Plus cloud on the wrong port (8080)", "tcp", 8080, "13.203.147.54", "cloud"]];
    $("side").innerHTML = `<h2>Choose an action</h2>
      <form class="lab" id="lab">
        <label for="labAct">What does the camera try?
          <select id="labAct">${acts.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join("")}</select></label>
        <button class="btn primary" id="labSend" type="submit">Send</button>
        <div class="verdict" id="verdict">The result will appear here.</div>
      </form>
      <ul class="rb" style="margin-top:4px">${RULES.map((r,i)=>`<li id="rb${i}"><span class="n">${i+1}</span><span>${r.t}<small>${r.s}</small></span></li>`).join("")}
        <li class="deny" id="rbx"><span class="n">✕</span><span><b>Anything else: not allowed.</b><small>default deny</small></span></li></ul>`;
    $("lab").addEventListener("submit", async e => {
      e.preventDefault();
      const a = acts[+$("labAct").value]; const [label, proto, port, ip, to] = a;
      $("labSend").disabled = true; hl(null);
      const v = $("verdict"); v.className = "verdict"; v.textContent = "Checking…";
      try {
        say(`The camera tries: <b>${label}</b>`);
        const g = await packet(["cam","guard"], proto.toUpperCase()+" "+port, cv("--amber"), {keep:true});
        const i = match(proto, port, ip);
        if (i >= 0){ g.remove(); hl(i,"ok"); mark(N.guard.x, N.guard.y-60, true, `line ${i+1}`);
          await packet(["guard",to], "", cv("--ok"));
          v.className = "verdict ok"; v.innerHTML = `<b>Allowed</b> by line ${i+1}: ${RULES[i].t}.`;
          say(`<b>Allowed.</b> Line ${i+1} of the rulebook permits it.`, "ok");
        } else { g.remove(); hl("x","bad"); mark(N.guard.x, N.guard.y-60, false, "blocked");
          const near = RULES.findIndex(r=>r.proto===proto && r.port===port);
          v.className = "verdict bad"; v.innerHTML = `<b>Blocked.</b> ` + (near>=0 ? `Line ${near+1} allows this kind of message, but only to its own server.` : `No line in the rulebook allows it.`);
          say(`<b>Blocked and logged.</b> ` + (near>=0 ? `Right kind of message, wrong destination.` : `Nothing in the rulebook allows it.`), "bad");
        }
      } catch(err){ if (err !== ABORT) console.error(err); }
      $("labSend").disabled = false;
    });
  },
  async play(){ say("Choose an action on the right and press <b>Send</b>."); },
  tech:["The guard's decision uses the same first-match logic as the real iptables chain: protocol, destination port and destination address must all match one line.",
        "Rules for the cloud servers are written with DNS names in the MUD file; the gateway resolves them to IP addresses and refreshes them."]
},

/* ================= navigation ================= */
function renderDots(){
  $("dots").innerHTML = PAGES.map((p,i)=>`<button class="dot ${i<S.page?"done":""} ${i===S.page?"on":""}" type="button" aria-label="Page ${i+1}: ${p.title.replace(/"/g,"")}" title="${p.kicker}: ${p.title.replace(/"/g,"")}" data-i="${i}"></button>`).join("");
  $("pageno").textContent = `${S.page+1} / ${PAGES.length}`;
}
function go(i){
  S.run++; S.playing = false;
  S.page = Math.max(0, Math.min(PAGES.length-1, i));
  const p = PAGES[S.page];
  $("kicker").textContent = p.kicker; $("title").textContent = p.title; $("lead").textContent = p.lead;
  $("seg").hidden = !p.mode;
  $("playBtn").hidden = !!p.big || !!p.lab;
  $("stagebox").hidden = !!p.big; $("bigbox").hidden = !p.big;
  if (p.big) $("bigbox").innerHTML = p.bigHtml;
  $("techBody").innerHTML = (p.tech||[]).map(t=>`<p style="margin:0">${t}</p>`).join("");
  $("tech").hidden = !(p.tech && p.tech.length);
  clear(); $("side").innerHTML = "";
  p.build();
  say(p.caption);
  $("prevBtn").disabled = S.page === 0;
  $("nextBtn").disabled = S.page === PAGES.length-1;
  $("playBtn").textContent = "▶ Play"; $("playBtn").disabled = false;
  renderDots();
  try { history.replaceState(null, "", "#p" + (S.page+1)); } catch(e){}
}
async function play(){
  const p = PAGES[S.page];
  if (S.playing) return;
  S.run++; S.playing = true;
  const myRun = S.run;
  $("playBtn").disabled = true; $("playBtn").textContent = "Playing…";
  clear(); p.build();
  try { await p.play(); } catch(e){ if (e !== ABORT) console.error(e); }
  if (myRun === S.run){ S.playing = false; $("playBtn").disabled = false; $("playBtn").textContent = "↻ Play again"; }
}
function setMode(m){
  S.mode = m;
  $("segBefore").setAttribute("aria-pressed", String(m==="before"));
  $("segAfter").setAttribute("aria-pressed", String(m==="after"));
  S.playing = false; S.run++; play();
}

$("dots").addEventListener("click", e => { const b = e.target.closest(".dot"); if (b) go(+b.dataset.i); });
$("prevBtn").addEventListener("click", () => go(S.page-1));
$("nextBtn").addEventListener("click", () => go(S.page+1));
$("playBtn").addEventListener("click", play);
$("segBefore").addEventListener("click", () => setMode("before"));
$("segAfter").addEventListener("click", () => setMode("after"));
$("speed").addEventListener("change", e => { S.speed = parseFloat(e.target.value); });
$("fsBtn").addEventListener("click", () => { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.())?.catch?.(()=>{}); });
document.addEventListener("keydown", e => {
  if (e.target.closest("input,select,textarea")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); go(S.page+1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); go(S.page-1); }
  else if (e.key === " " || e.key === "Enter"){ if (!e.target.closest("button,summary")){ e.preventDefault(); play(); } }
});
const start = (() => { const m = (location.hash||"").match(/^#p(\d+)$/); return m ? +m[1]-1 : 0; })();
go(start);
})();
</script>
